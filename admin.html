<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Anime Verse</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #0f0f1a; color: #fff; }

  /* ===== LOGIN SCREEN ===== */
  #loginScreen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
    position: fixed; inset: 0; z-index: 99999;
  }
  .login-box {
    background: #1a1a2e; padding: 45px 35px; border-radius: 16px;
    width: 100%; max-width: 380px;
    box-shadow: 0 20px 60px rgba(233, 69, 96, 0.2);
    border: 1px solid #2a2a4a;
  }
  .login-box .icon { text-align: center; font-size: 48px; margin-bottom: 10px; }
  .login-box h2 {
    text-align: center; color: #e94560; font-size: 24px; margin-bottom: 8px;
  }
  .login-box .sub {
    text-align: center; color: #888; font-size: 13px; margin-bottom: 30px;
  }
  .login-box input {
    width: 100%; padding: 14px; margin-bottom: 14px;
    border-radius: 10px; border: 1px solid #333;
    background: #0f0f1a; color: #fff; font-size: 15px; outline: none;
    transition: border 0.2s;
  }
  .login-box input:focus { border-color: #e94560; }
  .pwd-wrap { position: relative; }
  .pwd-wrap #togglePwd {
    position: absolute; right: 14px; top: 14px;
    cursor: pointer; font-size: 18px; user-select: none;
  }
  #loginBtn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #e94560, #c73650);
    color: #fff; border: none; border-radius: 10px;
    font-size: 16px; cursor: pointer; font-weight: bold; letter-spacing: 1px;
    transition: transform 0.2s;
  }
  #loginBtn:hover { transform: translateY(-2px); }
  #loginBtn:disabled { opacity: 0.6; cursor: not-allowed; }
  #loginError {
    color: #ff5555; text-align: center; margin-top: 16px;
    font-size: 14px; min-height: 20px;
  }

  /* ===== ADMIN PANEL ===== */
  #adminPanel { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px; background: #1a1a2e; border-radius: 12px;
    margin-bottom: 25px; border: 1px solid #2a2a4a;
  }
  .topbar h1 { color: #e94560; font-size: 22px; }
  #logoutBtn {
    padding: 10px 20px; background: #e94560; color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
  }
  .tabs {
    display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap;
  }
  .tab-btn {
    padding: 12px 22px; background: #1a1a2e; color: #aaa;
    border: 1px solid #2a2a4a; border-radius: 8px; cursor: pointer;
    font-weight: 600; transition: all 0.2s;
  }
  .tab-btn.active { background: #e94560; color: #fff; border-color: #e94560; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .card {
    background: #1a1a2e; padding: 25px; border-radius: 12px;
    margin-bottom: 20px; border: 1px solid #2a2a4a;
  }
  .card h3 { color: #e94560; margin-bottom: 18px; font-size: 18px; }
  .form-group { margin-bottom: 15px; }
  .form-group label {
    display: block; margin-bottom: 6px; color: #aaa; font-size: 13px;
  }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 12px; background: #0f0f1a;
    border: 1px solid #333; border-radius: 8px;
    color: #fff; font-size: 14px; outline: none;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
    border-color: #e94560;
  }
  .form-group textarea { min-height: 80px; resize: vertical; }
  .btn {
    padding: 12px 24px; background: #e94560; color: #fff;
    border: none; border-radius: 8px; cursor: pointer;
    font-weight: 600; font-size: 14px; transition: transform 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-green { background: #10b981; }
  .btn-blue { background: #3b82f6; }
  .btn-red { background: #ef4444; }
  .btn-gray { background: #4b5563; }

  .anime-item {
    display: flex; gap: 15px; padding: 15px;
    background: #0f0f1a; border-radius: 10px;
    margin-bottom: 12px; align-items: center;
    border: 1px solid #2a2a4a;
  }
  .anime-item img {
    width: 60px; height: 80px; object-fit: cover;
    border-radius: 6px; flex-shrink: 0;
  }
  .anime-info { flex: 1; min-width: 0; }
  .anime-info h4 { color: #fff; margin-bottom: 4px; }
  .anime-info p { color: #888; font-size: 12px; }
  .anime-actions { display: flex; gap: 8px; }
  .anime-actions button {
    padding: 8px 12px; border-radius: 6px; border: none;
    cursor: pointer; font-size: 12px; font-weight: 600;
  }

  .search-result {
    display: flex; gap: 12px; padding: 12px;
    background: #0f0f1a; border-radius: 8px;
    margin-bottom: 10px; cursor: pointer;
    border: 1px solid #2a2a4a; transition: all 0.2s;
  }
  .search-result:hover { border-color: #e94560; }
  .search-result img {
    width: 50px; height: 65px; object-fit: cover; border-radius: 5px;
  }
  .search-result-info { flex: 1; }
  .search-result-info h4 { font-size: 14px; margin-bottom: 4px; }
  .search-result-info p { font-size: 12px; color: #888; }

  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px; margin-bottom: 20px;
  }
  .stat-card {
    background: linear-gradient(135deg, #1a1a2e, #252545);
    padding: 20px; border-radius: 12px;
    border: 1px solid #2a2a4a; text-align: center;
  }
  .stat-card .num { font-size: 28px; color: #e94560; font-weight: bold; }
  .stat-card .label { color: #aaa; font-size: 13px; margin-top: 5px; }

  .toast {
    position: fixed; bottom: 30px; right: 30px;
    padding: 15px 25px; background: #10b981; color: #fff;
    border-radius: 10px; font-weight: 600; z-index: 99999;
    transform: translateY(100px); opacity: 0;
    transition: all 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.error { background: #ef4444; }

  .empty {
    text-align: center; padding: 40px; color: #666; font-size: 14px;
  }
</style>
</head>
<body>

<!-- ============================================ -->
<!-- LOGIN SCREEN -->
<!-- ============================================ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="icon">🔐</div>
    <h2>Admin Login</h2>
    <p class="sub">Anime Verse Control Panel</p>

    <input id="loginEmail" type="email" placeholder="Email" autocomplete="username">
    <div class="pwd-wrap">
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
      <span id="togglePwd">👁️</span>
    </div>

    <button id="loginBtn">LOGIN</button>
    <p id="loginError"></p>
  </div>
</div>


<!-- ============================================ -->
<!-- ADMIN PANEL -->
<!-- ============================================ -->
<div id="adminPanel">

  <div class="topbar">
    <h1>🎛️ Anime Verse Admin</h1>
    <button id="logoutBtn">Logout</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="addTab">➕ Add Anime</button>
    <button class="tab-btn" data-tab="searchTab">🔍 AniList Search</button>
    <button class="tab-btn" data-tab="listTab">📚 Manage Library</button>
    <button class="tab-btn" data-tab="statsTab">📊 Analytics</button>
  </div>

  <!-- ===== TAB 1: ADD MANUAL ===== -->
  <div id="addTab" class="tab-content active">
    <div class="card">
      <h3>Add New Anime (Manual)</h3>

      <div class="form-group">
        <label>Anime Title *</label>
        <input id="addTitle" type="text" placeholder="e.g. Naruto">
      </div>

      <div class="form-group">
        <label>Poster Image URL *</label>
        <input id="addPoster" type="text" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="addDesc" placeholder="Short description..."></textarea>
      </div>

      <div class="form-group">
        <label>Genre</label>
        <input id="addGenre" type="text" placeholder="e.g. Action, Adventure">
      </div>

      <div class="form-group">
        <label>Status</label>
        <select id="addStatus">
          <option value="Ongoing">Ongoing</option>
          <option value="Completed">Completed</option>
          <option value="Upcoming">Upcoming</option>
        </select>
      </div>

      <div class="form-group">
        <label>Total Episodes</label>
        <input id="addEpisodes" type="number" placeholder="e.g. 24" value="12">
      </div>

      <div class="form-group">
        <label>Rating (0 - 10)</label>
        <input id="addRating" type="number" step="0.1" placeholder="e.g. 8.5" value="8.0">
      </div>

      <div class="form-group">
        <label>Video URL (Episode 1)</label>
        <input id="addVideo" type="text" placeholder="https://...mp4 or m3u8">
      </div>

      <button class="btn" id="saveAnimeBtn">💾 Save Anime</button>
    </div>
  </div>

  <!-- ===== TAB 2: ANILIST SEARCH ===== -->
  <div id="searchTab" class="tab-content">
    <div class="card">
      <h3>Search Anime from AniList</h3>
      <div class="form-group">
        <input id="anilistQuery" type="text" placeholder="Type anime name... e.g. One Piece">
      </div>
      <button class="btn btn-blue" id="searchAnilistBtn">🔍 Search</button>
      <div id="anilistResults" style="margin-top: 20px;"></div>
    </div>
  </div>

  <!-- ===== TAB 3: MANAGE LIBRARY ===== -->
  <div id="listTab" class="tab-content">
    <div class="card">
      <h3>Manage Library</h3>
      <div class="form-group">
        <input id="librarySearch" type="text" placeholder="🔍 Search in library...">
      </div>
      <div id="animeList"></div>
    </div>
  </div>

  <!-- ===== TAB 4: ANALYTICS ===== -->
  <div id="statsTab" class="tab-content">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="num" id="statTotalAnime">0</div>
        <div class="label">Total Anime</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statTotalViews">0</div>
        <div class="label">Total Views</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statOngoing">0</div>
        <div class="label">Ongoing</div>
      </div>
      <div class="stat-card">
        <div class="num" id="statCompleted">0</div>
        <div class="label">Completed</div>
      </div>
    </div>

    <div class="card">
      <h3>Top 10 Most Viewed</h3>
      <div id="topViewedList"></div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>


<script>
/* ============================================ */
/* FIREBASE CONFIG - APNA ASLI CONFIG YAHA DAALO */
/* ============================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBHCaQPCzEJ0QTPZaXgx0xuk4f6eb_OuRU",
  authDomain: "anistreamx-903a3.firebaseapp.com",
  databaseURL: "https://anistreamx-903a3-default-rtdb.firebaseio.com",
  projectId: "anistreamx-903a3",
  storageBucket: "anistreamx-903a3.firebasestorage.app",
  messagingSenderId: "670816164518",
  appId: "1:670816164518:web:6a3222731f6b22696d3267",
  measurementId: "G-DW23SVGE6W"
};


/* ============================================ */
/* INIT FIREBASE */
/* ============================================ */
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const auth = firebase.auth();
const db = firebase.database();

/* ============================================ */
/* ELEMENTS */
/* ============================================ */
const loginScreen = document.getElementById('loginScreen');
const adminPanel  = document.getElementById('adminPanel');
const loginBtn    = document.getElementById('loginBtn');
const loginError  = document.getElementById('loginError');
const emailInput  = document.getElementById('loginEmail');
const pwdInput    = document.getElementById('loginPassword');
const togglePwd   = document.getElementById('togglePwd');
const toastEl     = document.getElementById('toast');

/* ============================================ */
/* PASSWORD SHOW/HIDE */
/* ============================================ */
togglePwd.addEventListener('click', () => {
  if (pwdInput.type === 'password') {
    pwdInput.type = 'text';
    togglePwd.textContent = '🙈';
  } else {
    pwdInput.type = 'password';
    togglePwd.textContent = '👁️';
  }
});

/* ============================================ */
/* TOAST HELPER */
/* ============================================ */
function showToast(msg, isError = false) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { toastEl.className = 'toast'; }, 3000);
}

/* ============================================ */
/* AUTH STATE CHECK */
/* ============================================ */
auth.onAuthStateChanged((user) => {
  if (user) {
    loginScreen.style.display = 'none';
    adminPanel.style.display = 'block';
    loadAnimeList();
    loadStats();
  } else {
    loginScreen.style.display = 'flex';
    adminPanel.style.display = 'none';
  }
});

/* ============================================ */
/* LOGIN */
/* ============================================ */
loginBtn.addEventListener('click', async () => {
  const email = emailInput.value.trim();
  const password = pwdInput.value;

  if (!email || !password) {
    loginError.textContent = '⚠️ Email aur Password dono bharo';
    return;
  }

  loginBtn.textContent = 'Logging in...';
  loginBtn.disabled = true;
  loginError.textContent = '';

  try {
    await auth.signInWithEmailAndPassword(email, password);
  } catch (err) {
    loginBtn.textContent = 'LOGIN';
    loginBtn.disabled = false;

    const errors = {
      'auth/wrong-password': '❌ Galat Password',
      'auth/user-not-found': '❌ Yeh Email registered nahi hai',
      'auth/invalid-email': '❌ Email galat format mein hai',
      'auth/too-many-requests': '⏳ Bahut baar try kiya, 5 min baad try karo',
      'auth/network-request-failed': '🌐 Internet check karo',
      'auth/invalid-credential': '❌ Galat Email ya Password'
    };
    loginError.textContent = errors[err.code] || '❌ ' + err.message;
  }
});

pwdInput.addEventListener('keypress', e => {
  if (e.key === 'Enter') loginBtn.click();
});
emailInput.addEventListener('keypress', e => {
  if (e.key === 'Enter') pwdInput.focus();
});

/* ============================================ */
/* LOGOUT */
/* ============================================ */
document.getElementById('logoutBtn').addEventListener('click', () => {
  if (confirm('Logout karna chahte ho?')) {
    auth.signOut().then(() => location.reload());
  }
});

/* ============================================ */
/* TABS */
/* ============================================ */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

/* ============================================ */
/* ADD MANUAL ANIME */
/* ============================================ */
document.getElementById('saveAnimeBtn').addEventListener('click', async () => {
  const title = document.getElementById('addTitle').value.trim();
  const poster = document.getElementById('addPoster').value.trim();

  if (!title || !poster) {
    showToast('Title aur Poster zaroori hai', true);
    return;
  }

  const animeData = {
    title,
    poster,
    description: document.getElementById('addDesc').value.trim(),
    genre: document.getElementById('addGenre').value.trim(),
    status: document.getElementById('addStatus').value,
    episodes: parseInt(document.getElementById('addEpisodes').value) || 12,
    rating: parseFloat(document.getElementById('addRating').value) || 8.0,
    videoUrl: document.getElementById('addVideo').value.trim(),
    views: 0,
    createdAt: Date.now()
  };

  try {
    await db.ref('animeverse/anime').push(animeData);
    showToast('✅ Anime add ho gaya!');
    clearAddForm();
    loadAnimeList();
    loadStats();
  } catch (err) {
    showToast('❌ Error: ' + err.message, true);
  }
});

function clearAddForm() {
  ['addTitle','addPoster','addDesc','addGenre','addVideo'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('addEpisodes').value = '12';
  document.getElementById('addRating').value = '8.0';
}

/* ============================================ */
/* ANILIST SEARCH */
/* ============================================ */
document.getElementById('searchAnilistBtn').addEventListener('click', searchAniList);
document.getElementById('anilistQuery').addEventListener('keypress', e => {
  if (e.key === 'Enter') searchAniList();
});

async function searchAniList() {
  const query = document.getElementById('anilistQuery').value.trim();
  if (!query) return;

  const resultsBox = document.getElementById('anilistResults');
  resultsBox.innerHTML = '<p style="color:#888;">Searching...</p>';

  const gql = `
    query ($search: String) {
      Page(perPage: 10) {
        media(search: $search, type: ANIME) {
          id
          title { romaji english }
          coverImage { large }
          description
          genres
          episodes
          status
          averageScore
        }
      }
    }
  `;

  try {
    const res = await fetch('https://graphql.anilist.co', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ query: gql, variables: { search: query } })
    });
    const data = await res.json();
    const media = data.data.Page.media;

    if (!media.length) {
      resultsBox.innerHTML = '<p style="color:#888;">Kuch nahi mila</p>';
      return;
    }

    resultsBox.innerHTML = media.map(m => `
      <div class="search-result" onclick='importFromAniList(${JSON.stringify(JSON.stringify(m)).slice(1, -1)})'>
        <img src="${m.coverImage.large}" alt="">
        <div class="search-result-info">
          <h4>${m.title.english || m.title.romaji}</h4>
          <p>${(m.genres || []).join(', ')}</p>
          <p>Episodes: ${m.episodes || '?'} | Score: ${m.averageScore || '?'}</p>
        </div>
      </div>
    `).join('');
  } catch (err) {
    resultsBox.innerHTML = '<p style="color:#ff5555;">Error: ' + err.message + '</p>';
  }
}

async function importFromAniList(jsonStr) {
  const m = JSON.parse(jsonStr);

  const animeData = {
    title: m.title.english || m.title.romaji,
    poster: m.coverImage.large,
    description: (m.description || '').replace(/<[^>]*>/g, '').slice(0, 500),
    genre: (m.genres || []).join(', '),
    status: m.status === 'FINISHED' ? 'Completed' : (m.status === 'RELEASING' ? 'Ongoing' : 'Upcoming'),
    episodes: m.episodes || 12,
    rating: m.averageScore ? (m.averageScore / 10).toFixed(1) : 8.0,
    videoUrl: '',
    views: 0,
    createdAt: Date.now()
  };

  try {
    await db.ref('animeverse/anime').push(animeData);
    showToast('✅ ' + animeData.title + ' import ho gaya!');
    loadAnimeList();
    loadStats();
  } catch (err) {
    showToast('❌ Error: ' + err.message, true);
  }
}

/* ============================================ */
/* LOAD ANIME LIST */
/* ============================================ */
let allAnimeCache = {};

function loadAnimeList() {
  db.ref('animeverse/anime').on('value', snap => {
    allAnimeCache = snap.val() || {};
    renderAnimeList();
  });
}

function renderAnimeList(filter = '') {
  const box = document.getElementById('animeList');
  const entries = Object.entries(allAnimeCache);

  const filtered = filter
    ? entries.filter(([id, a]) => (a.title || '').toLowerCase().includes(filter.toLowerCase()))
    : entries;

  if (!filtered.length) {
    box.innerHTML = '<div class="empty">Koi anime nahi mila</div>';
    return;
  }

  box.innerHTML = filtered.map(([id, a]) => `
    <div class="anime-item">
      <img src="${a.poster || ''}" alt="">
      <div class="anime-info">
        <h4>${a.title || 'Untitled'}</h4>
        <p>${a.genre || 'No genre'} | ${a.status || ''} | ${a.episodes || 0} eps | ⭐ ${a.rating || 0}</p>
      </div>
      <div class="anime-actions">
        <button class="btn-red" onclick="deleteAnime('${id}', '${(a.title || '').replace(/'/g, "\\'")}')">🗑️ Delete</button>
      </div>
    </div>
  `).join('');
}

document.getElementById('librarySearch').addEventListener('input', e => {
  renderAnimeList(e.target.value);
});

async function deleteAnime(id, title) {
  if (!confirm('Delete "' + title + '" ?')) return;
  try {
    await db.ref('animeverse/anime/' + id).remove();
    showToast('🗑️ Delete ho gaya');
    loadStats();
  } catch (err) {
    showToast('❌ ' + err.message, true);
  }
}

/* ============================================ */
/* ANALYTICS */
/* ============================================ */
function loadStats() {
  db.ref('animeverse/anime').on('value', snap => {
    const data = snap.val() || {};
    const arr = Object.values(data);

    document.getElementById('statTotalAnime').textContent = arr.length;
    document.getElementById('statOngoing').textContent = arr.filter(a => a.status === 'Ongoing').length;
    document.getElementById('statCompleted').textContent = arr.filter(a => a.status === 'Completed').length;

    const totalViews = arr.reduce((s, a) => s + (a.views || 0), 0);
    document.getElementById('statTotalViews').textContent = totalViews;

    const top10 = arr.sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 10);
    document.getElementById('topViewedList').innerHTML = top10.length
      ? top10.map(a => `
          <div class="anime-item">
            <img src="${a.poster || ''}" alt="">
            <div class="anime-info">
              <h4>${a.title}</h4>
              <p>👁️ ${a.views || 0} views</p>
            </div>
          </div>
        `).join('')
      : '<div class="empty">Abhi koi data nahi</div>';
  });
}
</script>

</body>
</html>
