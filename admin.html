<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch - Anime Verse</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0/dist/hls.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #08080f; color: #fff; min-height: 100vh; }

  .topbar {
    padding: 15px 20px;
    background: rgba(8,8,15,0.95);
    border-bottom: 1px solid rgba(233,69,96,0.2);
    display: flex; align-items: center; gap: 15px;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(20px);
  }
  .back-btn {
    padding: 8px 16px;
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 20px;
    color: #fff; cursor: pointer; font-size: 14px;
    transition: all 0.2s;
  }
  .back-btn:hover { border-color: #e94560; }
  .topbar-logo {
    font-size: 18px; font-weight: 800;
    background: linear-gradient(135deg, #e94560, #ff6b9d);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .player-page { max-width: 1400px; margin: 0 auto; padding: 20px; }

  .player-wrap {
    position: relative;
    width: 100%;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 25px;
    aspect-ratio: 16/9;
    border: 1px solid rgba(233,69,96,0.2);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  #videoPlayer {
    width: 100%; height: 100%; display: block;
    background: #000;
  }
  #iframePlayer {
    width: 100%; height: 100%; display: none;
    border: none; background: #000;
  }

  .player-error {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.95);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 15px; padding: 30px;
    text-align: center;
  }
  .player-error.show { display: flex; }
  .player-error h3 { color: #e94560; font-size: 20px; }
  .player-error p { color: #aaa; font-size: 14px; max-width: 400px; }
  .player-error button {
    padding: 12px 25px; background: #e94560;
    color: #fff; border: none; border-radius: 25px;
    cursor: pointer; font-weight: bold; font-size: 14px;
  }
  .player-error button:hover { opacity: 0.9; }

  .now-playing {
    background: linear-gradient(135deg, #1a1a2e, #252545);
    padding: 15px 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px solid rgba(233,69,96,0.3);
    display: flex; align-items: center; gap: 15px;
    flex-wrap: wrap;
  }
  .now-playing .label {
    background: #e94560;
    padding: 4px 12px;
    border-radius: 15px;
    font-size: 11px; font-weight: bold;
    letter-spacing: 1px;
  }
  .now-playing .ep-title { font-size: 16px; font-weight: 600; flex: 1; min-width: 200px; }
  .now-playing .ep-type {
    font-size: 11px; padding: 4px 10px; border-radius: 10px;
    background: rgba(16,185,129,0.2); color: #10b981; font-weight: bold;
  }

  .anime-header {
    display: flex; gap: 22px;
    margin-bottom: 35px;
    flex-wrap: wrap;
    padding: 20px;
    background: rgba(26,26,46,0.4);
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .anime-header-poster {
    width: 170px; height: 250px;
    object-fit: cover; border-radius: 12px;
    flex-shrink: 0;
    border: 2px solid rgba(233,69,96,0.4);
  }
  .anime-header-info { flex: 1; min-width: 250px; }
  .anime-header-info h1 {
    font-size: 30px; margin-bottom: 12px; font-weight: 800;
    background: linear-gradient(135deg, #fff, #ffb0c4);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .anime-header-meta {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;
  }
  .anime-header-meta span {
    background: #1a1a2e; padding: 6px 14px;
    border-radius: 20px; font-size: 12px;
    border: 1px solid rgba(233,69,96,0.3);
    color: #ffb0c4; font-weight: 600;
  }
  .anime-header-info p {
    color: #aaa; line-height: 1.7; font-size: 14px;
  }

  .episodes-section h2 {
    font-size: 22px; margin-bottom: 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .episodes-section h2::before {
    content: ''; width: 4px; height: 22px;
    background: #e94560; border-radius: 2px;
    box-shadow: 0 0 10px rgba(233,69,96,0.6);
  }
  .episodes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px; margin-bottom: 40px;
  }
  .episode-btn {
    padding: 15px 12px;
    background: #14141f;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: #fff; cursor: pointer;
    text-align: center; font-size: 14px;
    font-weight: 600; transition: all 0.25s;
    position: relative;
  }
  .episode-btn:hover {
    border-color: #e94560;
    background: rgba(233,69,96,0.1);
    transform: translateY(-3px);
  }
  .episode-btn.active {
    background: linear-gradient(135deg, #e94560, #c73650);
    border-color: #e94560;
    box-shadow: 0 8px 25px rgba(233,69,96,0.4);
  }
  .episode-btn .ep-num {
    display: block; font-size: 18px;
    font-weight: 800; margin-bottom: 4px;
  }
  .episode-btn .ep-title-small {
    display: block; font-size: 11px;
    color: rgba(255,255,255,0.7);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .episode-btn.active .ep-title-small { color: rgba(255,255,255,0.9); }

  .loading-full {
    text-align: center; padding: 120px 20px;
    display: flex; flex-direction: column; align-items: center;
  }
  .spinner {
    width: 50px; height: 50px;
    border: 4px solid #1a1a2e;
    border-top-color: #e94560;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-ep {
    text-align: center; padding: 40px;
    color: #666; font-size: 14px;
    background: rgba(26,26,46,0.4);
    border-radius: 12px;
    border: 1px dashed rgba(233,69,96,0.3);
  }

  @media (max-width: 768px) {
    .player-page { padding: 15px; }
    .anime-header { padding: 15px; gap: 15px; }
    .anime-header-poster { width: 110px; height: 165px; }
    .anime-header-info h1 { font-size: 20px; }
    .episodes-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
    .episode-btn { padding: 12px 8px; font-size: 12px; }
    .episode-btn .ep-num { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html'">← Back</button>
  <div class="topbar-logo">🎬 Anime Verse</div>
</div>

<div class="player-page">
  <div id="loadingView" class="loading-full">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>

  <div id="contentView" style="display:none;">

    <div class="player-wrap">
      <video id="videoPlayer" controls playsinline preload="metadata"></video>
      <iframe id="iframePlayer" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>

      <div class="player-error" id="playerError">
        <h3>⚠️ Video Play Nahi Ho Raha</h3>
        <p id="errorMsg">Agar primary link kaam nahi kar raha, backup try karo ya new tab mein open karo.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
          <button onclick="tryBackupSource()" id="backupBtn" style="display:none;">🔄 Try Backup</button>
          <button onclick="openInNewTab()" style="background:#3b82f6;">🔗 Open in New Tab</button>
        </div>
      </div>
    </div>

    <div class="now-playing" id="nowPlaying" style="display:none;">
      <span class="label">NOW PLAYING</span>
      <span class="ep-title" id="nowPlayingTitle">Episode 1</span>
      <span class="ep-type" id="nowPlayingType">MP4</span>
    </div>

    <div class="anime-header">
      <img class="anime-header-poster" id="animePoster" src="" alt=""
           onerror="this.src='https://via.placeholder.com/170x250/1a1a2e/e94560?text=No+Image'">
      <div class="anime-header-info">
        <h1 id="animeTitle"></h1>
        <div class="anime-header-meta" id="animeMeta"></div>
        <p id="animeDesc"></p>
      </div>
    </div>

    <div class="episodes-section">
      <h2>📺 Episodes</h2>
      <div class="episodes-grid" id="episodesGrid"></div>
    </div>

  </div>
</div>

<script>
/* ============================================ */
/* FIREBASE CONFIG */
/* ============================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBHCaQPCzEJ0QTPZaXgx0xuk4f6eb_OuRU",
  authDomain: "anistreamx-903a3.firebaseapp.com",
  databaseURL: "https://anistreamx-903a3-default-rtdb.firebaseio.com",
  projectId: "anistreamx-903a3",
  storageBucket: "anistreamx-903a3.firebasestorage.app",
  messagingSenderId: "670816164518",
  appId: "1:670816164518:web:6a3222731f6b22696d3267",
  measurementId: "G-DW23SVGE6W"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================================ */
/* URL PARAMS */
/* ============================================ */
const urlParams = new URLSearchParams(window.location.search);
const animeId = urlParams.get('id');

const video = document.getElementById('videoPlayer');
const iframe = document.getElementById('iframePlayer');
const errorBox = document.getElementById('playerError');
const errorMsg = document.getElementById('errorMsg');
const backupBtn = document.getElementById('backupBtn');

let currentAnime = null;
let currentEpisode = null;
let currentBackupUrl = null;
let currentVideoUrl = null;
let hlsInstance = null;

/* ============================================ */
/* START */
/* ============================================ */
if (!animeId) {
  document.getElementById('loadingView').innerHTML = `
    <h2 style="color:#e94560;">❌ Anime ID नहीं मिली</h2>
    <p style="color:#666;margin-top:10px;">Home page से कोई anime select करो</p>
    <button onclick="location.href='index.html'" style="margin-top:20px;padding:12px 25px;background:#e94560;color:#fff;border:none;border-radius:25px;cursor:pointer;font-weight:bold;">← Home</button>
  `;
} else {
  loadAnime(animeId);
}

/* ============================================ */
/* LOAD ANIME */
/* ============================================ */
function loadAnime(id) {
  db.ref('animeverse/anime/' + id).once('value').then(snap => {
    const anime = snap.val();
    if (!anime) {
      document.getElementById('loadingView').innerHTML = `
        <h2 style="color:#e94560;">❌ Anime नहीं मिला</h2>
        <button onclick="location.href='index.html'" style="margin-top:20px;padding:12px 25px;background:#e94560;color:#fff;border:none;border-radius:25px;cursor:pointer;font-weight:bold;">← Home</button>
      `;
      return;
    }
    currentAnime = { id, ...anime };
    renderAnimePage(currentAnime);
  }).catch(err => {
    document.getElementById('loadingView').innerHTML = 
      `<h2 style="color:#e94560;">❌ Error: ${err.message}</h2>`;
  });
}

/* ============================================ */
/* RENDER PAGE */
/* ============================================ */
function renderAnimePage(anime) {
  document.getElementById('loadingView').style.display = 'none';
  document.getElementById('contentView').style.display = 'block';

  document.getElementById('animePoster').src = anime.poster || '';
  document.getElementById('animeTitle').textContent = anime.title || 'Untitled';
  document.getElementById('animeDesc').textContent = anime.description || 'No description.';

  document.getElementById('animeMeta').innerHTML = `
    <span>📺 ${anime.episodes || '?'} Episodes</span>
    <span>⭐ ${anime.rating || '?'}/10</span>
    <span>${anime.status || 'Unknown'}</span>
    ${anime.genre ? `<span>${anime.genre}</span>` : ''}
  `;

  renderEpisodes(anime);

  // Auto-play first episode
  const episodes = getSortedEpisodes(anime);
  if (episodes.length) {
    setTimeout(() => playEpisode(episodes[0][1]), 300);
  } else {
    document.getElementById('episodesGrid').innerHTML = 
      '<div class="empty-ep" style="grid-column:1/-1;">📭 Abhi koi episode add nahi hua</div>';
  }
}

/* ============================================ */
/* EPISODES */
/* ============================================ */
function getSortedEpisodes(anime) {
  const list = anime.episodeList || {};
  return Object.entries(list)
    .filter(([k, v]) => v && typeof v === 'object' && v.videoUrl)
    .sort((a, b) => (a[1].number || 0) - (b[1].number || 0));
}

function renderEpisodes(anime) {
  const grid = document.getElementById('episodesGrid');
  const episodes = getSortedEpisodes(anime);

  if (!episodes.length) {
    grid.innerHTML = '<div class="empty-ep" style="grid-column:1/-1;">📭 Abhi koi episode add nahi hua. Admin panel se add karo.</div>';
    return;
  }

  grid.innerHTML = episodes.map(([key, ep]) => `
    <button class="episode-btn" data-ep-key="${key}" data-ep-num="${ep.number}">
      <span class="ep-num">EP ${ep.number}</span>
      <span class="ep-title-small">${ep.title || 'Episode ' + ep.number}</span>
    </button>
  `).join('');

  // Attach click listeners
  grid.querySelectorAll('.episode-btn').forEach((btn, idx) => {
    btn.addEventListener('click', () => playEpisode(episodes[idx][1]));
  });
}

/* ============================================ */
/* PLAY EPISODE */
/* ============================================ */
function playEpisode(ep) {
  currentEpisode = ep;
  currentBackupUrl = ep.backupUrl || null;
  currentVideoUrl = ep.videoUrl;

  // Highlight active button
  document.querySelectorAll('.episode-btn').forEach(btn => {
    btn.classList.remove('active');
    if (String(btn.dataset.epNum) === String(ep.number)) btn.classList.add('active');
  });

  // Show now playing
  document.getElementById('nowPlaying').style.display = 'flex';
  document.getElementById('nowPlayingTitle').textContent = ep.title || `Episode ${ep.number}`;
  document.getElementById('nowPlayingType').textContent = (ep.videoType || 'unknown').toUpperCase();

  // Reset player
  errorBox.classList.remove('show');
  backupBtn.style.display = currentBackupUrl ? 'inline-block' : 'none';

  // Detect type & play
  const type = ep.videoType || detectLinkType(ep.videoUrl);

  if (type === 'mp4' || type === 'hls') {
    playVideoSource(ep.videoUrl, type);
  } else {
    playEmbed(ep.videoUrl);
  }

  // Scroll to player
  document.querySelector('.player-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ============================================ */
/* PLAY VIDEO (MP4 / HLS) */
/* ============================================ */
function playVideoSource(url, type) {
  iframe.style.display = 'none';
  iframe.src = '';
  video.style.display = 'block';

  // HLS cleanup
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

  if (type === 'hls' || url.toLowerCase().includes('.m3u8')) {
    // HLS use hls.js
    if (Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(video);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {});
      });
      hlsInstance.on(Hls.Events.ERROR, (e, data) => {
        if (data.fatal) showPlayerError('HLS stream load nahi ho raha');
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play().catch(() => {});
    } else {
      showPlayerError('Yeh browser HLS support nahi karta');
    }
  } else {
    // Normal MP4
    video.src = url;
    video.load();
    video.play().catch(() => {});
  }
}

/* ============================================ */
/* PLAY EMBED (iframe) */
/* ============================================ */
function playEmbed(url) {
  video.pause();
  video.removeAttribute('src');
  video.load();
  video.style.display = 'none';

  iframe.style.display = 'block';
  iframe.src = url;

  // Iframe fail detection (timeout)
  setTimeout(() => {
    // If iframe loaded but might be blocked, user can use "Open in new tab"
  }, 5000);
}

/* ============================================ */
/* ERROR HANDLING */
/* ============================================ */
video.addEventListener('error', () => {
  showPlayerError('Video load nahi ho raha. Link check karo ya backup try karo.');
});

function showPlayerError(msg) {
  errorMsg.textContent = msg || 'Kuch problem aa gayi.';
  errorBox.classList.add('show');
}

function tryBackupSource() {
  if (!currentBackupUrl) return;
  errorBox.classList.remove('show');
  const type = detectLinkType(currentBackupUrl);
  if (type === 'mp4' || type === 'hls') {
    playVideoSource(currentBackupUrl, type);
  } else {
    playEmbed(currentBackupUrl);
  }
}

function openInNewTab() {
  if (currentVideoUrl) window.open(currentVideoUrl, '_blank');
}

/* ============================================ */
/* LINK TYPE DETECT */
/* ============================================ */
function detectLinkType(url) {
  if (!url) return 'unknown';
  const lower = url.toLowerCase();
  if (lower.match(/\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/)) return 'mp4';
  if (lower.match(/\.m3u8(\?.*)?$/)) return 'hls';
  return 'embed';
}
</script>

</body>
</html>
