<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Details — AnimeVerse</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#0b0b0f; --card:#15151c; --accent:#e50914; --gold:#ffc107;
  --text:#fff; --muted:#9a9aa5; }
body { background:var(--bg); color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif; padding-bottom:80px; }

.topbar { position:sticky; top:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; background:rgba(11,11,15,.98);
  backdrop-filter:blur(10px); border-bottom:1px solid #1e1e28; }
.topbar .logo { font-size:17px; font-weight:800; }
.topbar .logo span { color:var(--accent); }
.tb-btn { width:36px; height:36px; border-radius:8px;
  background:#1a1a22; border:1px solid #2a2a35; color:#fff;
  font-size:15px; cursor:pointer; display:grid; place-items:center; }

.poster-hero { display:flex; justify-content:center; padding:26px 18px 16px; }
.poster-hero img { width:200px; height:290px; object-fit:cover;
  border-radius:10px; box-shadow:0 20px 50px rgba(0,0,0,.8);
  border:1px solid #22222c; }

.info { padding:0 18px; text-align:center; }
.info h1 { font-size:22px; font-weight:800; line-height:1.25;
  margin-bottom:14px; }

.badges-row { display:flex; flex-wrap:wrap; gap:7px;
  justify-content:center; margin-bottom:16px; }
.chip-badge { font-size:11px; font-weight:700; padding:4px 9px;
  border-radius:5px; border:1px solid #2a2a35; background:#1a1a22; color:#d0d0d8; }
.chip-badge.rating { color:var(--accent);
  border-color:rgba(229,9,20,.4); background:rgba(229,9,20,.1); }
.chip-badge.lang { color:#ff8a3d;
  border-color:rgba(255,138,61,.4); background:rgba(255,138,61,.1); }

.genres { display:flex; flex-wrap:wrap; gap:8px;
  justify-content:center; margin-bottom:20px; }
.genre-tag { font-size:12px; padding:6px 14px; border-radius:20px;
  background:#1a1a22; border:1px solid #2a2a35; color:#d0d0d8; }

.desc-wrap { padding:0 18px; margin-bottom:22px; }
.desc { color:#b8b8c2; font-size:13.5px; line-height:1.65;
  max-height:66px; overflow:hidden; transition:max-height .3s; }
.desc.open { max-height:800px; }
.show-more { color:var(--accent); font-size:12px; font-weight:700;
  margin-top:6px; cursor:pointer; display:inline-block; }

.play-btn { display:block; margin:0 18px 22px; padding:16px;
  border-radius:10px; background:var(--accent); color:#fff;
  font-size:15px; font-weight:800; text-align:center;
  text-decoration:none; box-shadow:0 10px 30px rgba(229,9,20,.4);
  transition:transform .2s; }
.play-btn:hover { transform:scale(1.02); }

.sec-title { display:flex; align-items:center; gap:10px;
  padding:0 18px; margin:24px 0 14px; }
.sec-title::before { content:''; width:4px; height:18px;
  background:var(--accent); border-radius:2px; }
.sec-title h2 { font-size:14px; font-weight:800; letter-spacing:.5px; }

.ep-grid { display:grid; grid-template-columns:repeat(3,1fr);
  gap:10px; padding:0 18px; }
@media (min-width:600px) { .ep-grid { grid-template-columns:repeat(4,1fr); } }

.ep-card { position:relative; border-radius:8px; overflow:hidden;
  cursor:pointer; aspect-ratio:16/11; background:var(--card);
  border:1px solid #1e1e28; transition:transform .2s; }
.ep-card:hover { transform:translateY(-3px); }
.ep-card img { width:100%; height:100%; object-fit:cover; display:block; }
.ep-overlay { position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.95) 0%,
    rgba(0,0,0,.15) 55%, transparent 100%); }
.ep-num { position:absolute; top:6px; left:6px;
  background:var(--accent); color:#fff; font-size:11px; font-weight:800;
  padding:2px 7px; border-radius:4px; }
.ep-title { position:absolute; bottom:6px; left:6px; right:6px;
  font-size:11px; font-weight:600; line-height:1.25; color:#fff;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; }
.ep-play { position:absolute; inset:0; display:grid; place-items:center;
  color:#fff; font-size:26px; opacity:0; transition:opacity .2s; }
.ep-card:hover .ep-play { opacity:.95; }

.bottom-nav { position:fixed; bottom:0; left:0; right:0;
  background:rgba(11,11,15,.98); backdrop-filter:blur(10px);
  border-top:1px solid #1e1e28; display:flex;
  justify-content:space-around; padding:10px 0 12px; z-index:200; }
.bn-item { display:flex; flex-direction:column; align-items:center;
  gap:3px; color:var(--muted); font-size:10px; font-weight:700;
  text-decoration:none; cursor:pointer; }
.bn-item.active { color:var(--accent); }
.bn-item .bn-icon { font-size:20px; }
</style>
</head>
<body>

<div class="topbar">
  <button class="tb-btn" onclick="history.back()">←</button>
  <div class="logo">ANIME<span>VERSE</span></div>
  <div style="display:flex;gap:8px">
    <button class="tb-btn" onclick="navigator.share?.({title:document.title,url:location.href})">📤</button>
  </div>
</div>

<div id="content">
  <div style="display:grid;place-items:center;min-height:60vh;">
    <div style="width:34px;height:34px;border:3px solid rgba(255,255,255,.15);
      border-top-color:#e50914;border-radius:50%;animation:spin .8s linear infinite;"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a class="bn-item" href="index.html"><span class="bn-icon">🏠</span>HOME</a>
  <a class="bn-item active"><span class="bn-icon">📖</span>DETAIL</a>
  <a class="bn-item" onclick="location.reload()"><span class="bn-icon">🔄</span>REFRESH</a>
  <a class="bn-item" href="admin.html"><span class="bn-icon">⚙️</span>ADMIN</a>
</nav>

<style>@keyframes spin { to { transform:rotate(360deg); } }</style>

<script src="data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const animeId = Number(params.get('id')) || 1;

function render() {
  const a = getAnime(animeId);
  if (!a) {
    document.getElementById('content').innerHTML =
      '<p style="padding:40px;text-align:center;color:#9a9aa5">Anime nahi mila</p>';
    return;
  }
  document.title = a.title + ' — AnimeVerse';

  const season1 = a.seasons?.[0];
  const eps = season1?.episodes || [];
  const totalEps = (a.seasons || []).reduce((s, x) => s + (x.episodes?.length || 0), 0);

  document.getElementById('content').innerHTML = `
    <div class="poster-hero">
      <img src="${imgUrl(a.poster, 400, 600)}" alt="${a.title}">
    </div>

    <div class="info">
      <h1>${a.title}</h1>
      <div class="badges-row">
        <span class="chip-badge rating">★ ${a.rating}</span>
        <span class="chip-badge">S${a.seasons?.length || 0}</span>
        <span class="chip-badge">E${totalEps}</span>
        <span class="chip-badge">${a.status}</span>
        <span class="chip-badge lang">${langLabels[a.lang] || 'JP'}</span>
      </div>
      <div class="genres">
        ${(a.genres || []).map(g => `<span class="genre-tag">${g}</span>`).join('')}
      </div>
    </div>

    <div class="desc-wrap">
      <p class="desc" id="desc">${a.description || ''}</p>
      <span class="show-more" onclick="toggleDesc()">Show more ⌄</span>
    </div>

    ${eps.length ? `
      <a class="play-btn" href="watch.html?id=${a.id}&s=1&ep=${eps[0].num}">
        ▶ Watch Episode 1
      </a>
    ` : '<div style="padding:0 18px 22px;color:var(--muted);text-align:center;">Abhi koi episode nahi.</div>'}

    ${eps.length ? `
      <div class="sec-title"><h2>EPISODES — SEASON ${season1.number}</h2></div>
      <div class="ep-grid">
        ${eps.map(ep => `
          <div class="ep-card"
               onclick="location.href='watch.html?id=${a.id}&s=${season1.number}&ep=${ep.num}'">
            <img src="${imgUrl(ep.thumb, 300, 200)}" alt="" loading="lazy">
            <div class="ep-overlay"></div>
            <span class="ep-num">${ep.num}</span>
            <span class="ep-title">${ep.title}</span>
            <div class="ep-play">▶</div>
          </div>
        `).join('')}
      </div>
    ` : ''}
  `;
}

function toggleDesc() {
  const d = document.getElementById('desc');
  d.classList.toggle('open');
  document.querySelector('.show-more').textContent =
    d.classList.contains('open') ? 'Show less ⌃' : 'Show more ⌄';
}

window.onDataUpdate = render;
onDBReady(render);
</script>
</body>
</html>
