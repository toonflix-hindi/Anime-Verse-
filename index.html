<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Verse - Watch Anime Free</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #0a0a14; color: #fff; overflow-x: hidden; }

  /* ===== HEADER ===== */
  .header {
    position: sticky; top: 0; z-index: 1000;
    background: rgba(10, 10, 20, 0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid #1a1a2e;
    padding: 15px 20px;
  }
  .header-inner {
    max-width: 1400px; margin: 0 auto;
    display: flex; align-items: center; gap: 20px;
    flex-wrap: wrap;
  }
  .logo {
    font-size: 24px; font-weight: bold;
    background: linear-gradient(135deg, #e94560, #ff6b9d);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    cursor: pointer; flex-shrink: 0;
  }
  .search-wrap {
    flex: 1; min-width: 250px; max-width: 600px; position: relative;
  }
  .search-box {
    width: 100%; padding: 12px 45px 12px 18px;
    background: #1a1a2e; border: 1px solid #2a2a4a;
    border-radius: 30px; color: #fff; font-size: 15px;
    outline: none; transition: all 0.3s;
  }
  .search-box:focus { border-color: #e94560; box-shadow: 0 0 20px rgba(233,69,96,0.3); }
  .search-icon {
    position: absolute; right: 18px; top: 12px;
    font-size: 18px; color: #666; pointer-events: none;
  }
  .search-results-dropdown {
    position: absolute; top: 55px; left: 0; right: 0;
    background: #1a1a2e; border: 1px solid #2a2a4a;
    border-radius: 12px; max-height: 400px; overflow-y: auto;
    display: none; z-index: 1001; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .search-results-dropdown.show { display: block; }
  .search-result-item {
    display: flex; gap: 12px; padding: 12px;
    cursor: pointer; border-bottom: 1px solid #2a2a4a;
    transition: background 0.2s;
  }
  .search-result-item:hover { background: #252545; }
  .search-result-item img {
    width: 45px; height: 60px; object-fit: cover; border-radius: 6px;
  }
  .search-result-item-info h4 { font-size: 14px; margin-bottom: 4px; }
  .search-result-item-info p { font-size: 12px; color: #888; }
  .admin-btn {
    padding: 10px 20px; background: #e94560; color: #fff;
    border: none; border-radius: 25px; cursor: pointer;
    font-weight: 600; font-size: 14px; flex-shrink: 0;
    transition: transform 0.2s;
  }
  .admin-btn:hover { transform: scale(1.05); }

  /* ===== SCROLLING TICKER (NEW ANIME) ===== */
  .ticker-section {
    background: linear-gradient(90deg, #e94560, #c73650);
    padding: 12px 0; overflow: hidden;
    position: relative; white-space: nowrap;
  }
  .ticker-label {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: #0a0a14; padding: 0 20px;
    display: flex; align-items: center;
    font-weight: bold; font-size: 14px;
    z-index: 2; letter-spacing: 1px;
    color: #e94560;
  }
  .ticker-track {
    display: inline-block;
    animation: tickerScroll 30s linear infinite;
    padding-left: 120px;
  }
  .ticker-track:hover { animation-play-state: paused; }
  .ticker-item {
    display: inline-block; margin-right: 50px;
    font-size: 14px; font-weight: 500;
    cursor: pointer; color: #fff;
  }
  .ticker-item .new-badge {
    background: #fff; color: #e94560;
    padding: 2px 8px; border-radius: 10px;
    font-size: 10px; font-weight: bold;
    margin-right: 8px; letter-spacing: 0.5px;
  }
  @keyframes tickerScroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* ===== HERO SECTION ===== */
  .hero {
    position: relative; height: 500px;
    overflow: hidden; margin-bottom: 40px;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: blur(8px) brightness(0.3);
    transform: scale(1.1);
  }
  .hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, #0a0a14 10%, transparent 60%);
  }
  .hero-content {
    position: relative; z-index: 2;
    max-width: 1400px; margin: 0 auto;
    padding: 60px 20px; height: 100%;
    display: flex; align-items: center; gap: 40px;
    flex-wrap: wrap;
  }
  .hero-poster {
    width: 220px; height: 320px;
    object-fit: cover; border-radius: 16px;
    box-shadow: 0 20px 60px rgba(233,69,96,0.4);
    flex-shrink: 0;
  }
  .hero-info { flex: 1; min-width: 280px; }
  .hero-info .tag {
    display: inline-block; background: #e94560;
    padding: 4px 12px; border-radius: 20px;
    font-size: 12px; font-weight: bold;
    margin-bottom: 15px; letter-spacing: 1px;
  }
  .hero-info h1 {
    font-size: 42px; font-weight: 800;
    margin-bottom: 12px; line-height: 1.1;
  }
  .hero-meta {
    display: flex; gap: 15px; margin-bottom: 20px;
    flex-wrap: wrap; font-size: 14px; color: #aaa;
  }
  .hero-meta span {
    background: #1a1a2e; padding: 6px 14px; border-radius: 20px;
  }
  .hero-info p {
    color: #ccc; font-size: 15px; line-height: 1.6;
    margin-bottom: 25px; max-width: 600px;
    display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .hero-btns { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-play {
    padding: 14px 32px;
    background: linear-gradient(135deg, #e94560, #c73650);
    color: #fff; border: none; border-radius: 30px;
    font-size: 16px; font-weight: bold; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: transform 0.2s;
  }
  .btn-play:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(233,69,96,0.5); }

  /* ===== SECTION TITLE ===== */
  .section-title {
    max-width: 1400px; margin: 0 auto 25px;
    padding: 0 20px; display: flex;
    align-items: center; justify-content: space-between;
  }
  .section-title h2 {
    font-size: 24px; font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title h2::before {
    content: ''; width: 4px; height: 24px;
    background: #e94560; border-radius: 2px;
  }

  /* ===== ANIME GRID ===== */
  .anime-grid {
    max-width: 1400px; margin: 0 auto 60px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
  }
  .anime-card {
    background: #1a1a2e; border-radius: 12px;
    overflow: hidden; cursor: pointer;
    transition: all 0.3s; border: 1px solid #2a2a4a;
  }
  .anime-card:hover {
    transform: translateY(-8px);
    border-color: #e94560;
    box-shadow: 0 15px 40px rgba(233,69,96,0.3);
  }
  .anime-card-poster {
    position: relative; width: 100%; aspect-ratio: 2/3;
    overflow: hidden;
  }
  .anime-card-poster img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.5s;
  }
  .anime-card:hover .anime-card-poster img { transform: scale(1.1); }
  .anime-card-badge {
    position: absolute; top: 8px; left: 8px;
    background: rgba(233,69,96,0.9);
    padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: bold;
  }
  .anime-card-rating {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(0,0,0,0.7);
    padding: 4px 10px; border-radius: 20px;
    font-size: 12px; font-weight: bold;
    backdrop-filter: blur(10px);
  }
  .anime-card-info { padding: 12px; }
  .anime-card-info h3 {
    font-size: 14px; font-weight: 600;
    margin-bottom: 6px;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .anime-card-info p {
    font-size: 12px; color: #888;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ===== LOADING ===== */
  .loading {
    text-align: center; padding: 60px;
    color: #666; font-size: 16px;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 4px solid #2a2a4a;
    border-top-color: #e94560;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 15px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center; padding: 60px;
    color: #666; font-size: 15px;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .hero { height: auto; }
    .hero-content { padding: 30px 20px; }
    .hero-poster { width: 140px; height: 200px; }
    .hero-info h1 { font-size: 26px; }
    .anime-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .logo { font-size: 18px; }
    .ticker-label { font-size: 12px; padding: 0 12px; }
  }
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="header-inner">
    <div class="logo" onclick="location.href='index.html'">🎬 Anime Verse</div>
    
    <div class="search-wrap">
      <input type="text" class="search-box" id="searchBox" 
             placeholder="🔍 Anime search karo... (e.g. Naruto, One Piece)">
      <span class="search-icon">🔍</span>
      <div class="search-results-dropdown" id="searchDropdown"></div>
    </div>

    <button class="admin-btn" onclick="location.href='admin.html'">⚙️ Admin</button>
  </div>
</header>

<!-- ===== TICKER (NEW ANIME) ===== -->
<div class="ticker-section">
  <div class="ticker-label">🔥 NEW</div>
  <div class="ticker-track" id="tickerTrack">
    <span class="ticker-item">Loading...</span>
  </div>
</div>

<!-- ===== HERO ===== -->
<section class="hero" id="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content" id="heroContent">
    <div class="loading">
      <div class="spinner"></div>
      Loading featured anime...
    </div>
  </div>
</section>

<!-- ===== LATEST ANIME ===== -->
<div class="section-title">
  <h2>🆕 Latest Anime</h2>
</div>
<div class="anime-grid" id="latestGrid">
  <div class="loading">
    <div class="spinner"></div>
    Loading anime...
  </div>
</div>

<!-- ===== ALL ANIME ===== -->
<div class="section-title">
  <h2>📚 All Anime</h2>
</div>
<div class="anime-grid" id="allGrid"></div>

<script>
/* ============================================ */
/* FIREBASE CONFIG - APNA ASLI CONFIG DAALO */
/* ============================================ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY_HERE",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================================ */
/* GLOBAL STATE */
/* ============================================ */
let allAnimeData = {};

/* ============================================ */
/* LOAD ANIME FROM FIREBASE */
/* ============================================ */
db.ref('animeverse/anime').on('value', snap => {
  allAnimeData = snap.val() || {};
  const entries = Object.entries(allAnimeData);

  if (!entries.length) {
    document.getElementById('latestGrid').innerHTML = 
      '<div class="empty-state">Abhi koi anime add nahi hua. Admin panel se add karo.</div>';
    document.getElementById('allGrid').innerHTML = '';
    return;
  }

  // Sort by createdAt (newest first)
  entries.sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

  // Hero = newest anime
  renderHero(entries[0][1]);

  // Ticker = latest 10
  renderTicker(entries.slice(0, 10));

  // Latest grid = latest 12
  renderGrid('latestGrid', entries.slice(0, 12));

  // All grid = all
  renderGrid('allGrid', entries);
});

/* ============================================ */
/* HERO */
/* ============================================ */
function renderHero(anime) {
  const hero = document.getElementById('hero');
  hero.querySelector('.hero-bg').style.backgroundImage = `url('${anime.poster}')`;

  document.getElementById('heroContent').innerHTML = `
    <img class="hero-poster" src="${anime.poster}" alt="${anime.title}">
    <div class="hero-info">
      <span class="tag">⭐ FEATURED</span>
      <h1>${anime.title}</h1>
      <div class="hero-meta">
        <span>📺 ${anime.episodes || '?'} Episodes</span>
        <span>⭐ ${anime.rating || '?'}/10</span>
        <span>${anime.status || ''}</span>
      </div>
      <p>${anime.description || 'Description available soon...'}</p>
      <div class="hero-btns">
        <button class="btn-play" onclick="goToAnime('${anime.id || ''}')">
          ▶️ Watch Now
        </button>
      </div>
    </div>
  `;
}

/* ============================================ */
/* TICKER */
/* ============================================ */
function renderTicker(animeList) {
  const track = document.getElementById('tickerTrack');
  
  // Duplicate content for seamless loop
  const items = animeList.map(a => `
    <span class="ticker-item" onclick="goToAnime('${a.id || ''}')">
      <span class="new-badge">NEW</span>
      ${a.title} — Episode ${a.episodes || 1} Out Now!
    </span>
  `).join('');

  track.innerHTML = items + items; // Double for seamless loop
}

/* ============================================ */
/* GRID */
/* ============================================ */
function renderGrid(containerId, animeList) {
  const grid = document.getElementById(containerId);

  if (!animeList.length) {
    grid.innerHTML = '<div class="empty-state">No anime found</div>';
    return;
  }

  grid.innerHTML = animeList.map(([id, a]) => `
    <div class="anime-card" onclick="goToAnime('${id}')">
      <div class="anime-card-poster">
        <img src="${a.poster || ''}" alt="${a.title}" loading="lazy">
        <span class="anime-card-badge">${a.status || 'Anime'}</span>
        <span class="anime-card-rating">⭐ ${a.rating || '?'}</span>
      </div>
      <div class="anime-card-info">
        <h3>${a.title || 'Untitled'}</h3>
        <p>${a.genre || 'No genre'} • ${a.episodes || 0} eps</p>
      </div>
    </div>
  `).join('');
}

/* ============================================ */
/* SEARCH (LIVE) */
/* ============================================ */
const searchBox = document.getElementById('searchBox');
const searchDropdown = document.getElementById('searchDropdown');

searchBox.addEventListener('input', (e) => {
  const query = e.target.value.trim().toLowerCase();
  
  if (!query) {
    searchDropdown.classList.remove('show');
    return;
  }

  const matches = Object.entries(allAnimeData)
    .filter(([id, a]) => (a.title || '').toLowerCase().includes(query))
    .slice(0, 8);

  if (!matches.length) {
    searchDropdown.innerHTML = '<div style="padding:20px;text-align:center;color:#666;font-size:14px;">Kuch nahi mila 😔</div>';
    searchDropdown.classList.add('show');
    return;
  }

  searchDropdown.innerHTML = matches.map(([id, a]) => `
    <div class="search-result-item" onclick="goToAnime('${id}')">
      <img src="${a.poster || ''}" alt="">
      <div class="search-result-item-info">
        <h4>${a.title}</h4>
        <p>${a.genre || 'No genre'} • ${a.episodes || 0} eps • ⭐ ${a.rating || '?'}</p>
      </div>
    </div>
  `).join('');

  searchDropdown.classList.add('show');
});

// Close dropdown on click outside
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) {
    searchDropdown.classList.remove('show');
  }
});

// Enter = go to first result
searchBox.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    const first = searchDropdown.querySelector('.search-result-item');
    if (first) first.click();
  }
});

/* ============================================ */
/* NAVIGATION */
/* ============================================ */
function goToAnime(id) {
  if (id) window.location.href = `anime.html?id=${id}`;
}
</script>

</body>
</html>
