<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — AnimeVerse</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg:#0b0b0f; --card:#15151c; --accent:#e50914;
  --gold:#ffc107; --text:#fff; --muted:#9a9aa5; }
body { background:var(--bg); color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif; padding-bottom:80px; }

.topbar { position:sticky; top:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; background:rgba(11,11,15,.98);
  backdrop-filter:blur(10px); border-bottom:1px solid #1e1e28; }
.topbar .logo { font-size:17px; font-weight:800; }
.topbar .logo span { color:var(--accent); }
.tb-btn { width:36px; height:36px; border-radius:8px;
  background:#1a1a22; border:1px solid #2a2a35; color:#fff;
  font-size:15px; cursor:pointer; display:grid; place-items:center; }

.player-shell { background:#000; position:relative; width:100%;
  aspect-ratio:16/9; overflow:hidden; user-select:none; }
@media (min-width:900px) { .player-shell { max-height:75vh; } }

video { width:100%; height:100%; display:block; object-fit:contain; background:#000; }

.pl-ui { position:absolute; inset:0;
  display:flex; flex-direction:column; justify-content:space-between;
  background:linear-gradient(to bottom,
    rgba(0,0,0,.6) 0%, transparent 22%, transparent 55%, rgba(0,0,0,.92) 100%);
  padding:12px 14px; opacity:1; transition:opacity .3s; pointer-events:none; }
.pl-ui.hide { opacity:0; }
.pl-ui > * { pointer-events:auto; }

.pl-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.pl-pill { background:rgba(0,0,0,.65); backdrop-filter:blur(8px);
  padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600;
  display:inline-flex; align-items:center; gap:5px; cursor:pointer;
  border:1px solid rgba(255,255,255,.1); color:#fff; }
.pl-pill.quality { background:var(--accent); border-color:var(--accent); }
.pl-top-right { display:flex; gap:6px; flex-wrap:wrap; }

.pl-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  display:flex; align-items:center; gap:clamp(28px, 8vw, 64px); }
.pl-btn { background:rgba(0,0,0,.55); backdrop-filter:blur(10px);
  width:clamp(44px, 11vw, 54px); height:clamp(44px, 11vw, 54px);
  border-radius:50%; color:#fff; border:1px solid rgba(255,255,255,.12);
  font-size:clamp(16px, 3.5vw, 19px); cursor:pointer;
  display:grid; place-items:center; position:relative;
  transition:transform .15s, background .2s; }
.pl-btn.big { width:clamp(58px, 14vw, 70px); height:clamp(58px, 14vw, 70px);
  font-size:clamp(20px, 4.5vw, 26px); background:rgba(229,9,20,.92); }
.pl-btn .bt-label { position:absolute; bottom:-15px; left:50%;
  transform:translateX(-50%); font-size:9px; font-weight:700; color:#fff;
  opacity:.85; white-space:nowrap; }

.big-play { position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%); width:72px; height:72px;
  border-radius:50%; background:rgba(229,9,20,.95); border:none;
  color:#fff; font-size:28px; cursor:pointer; z-index:5;
  display:grid; place-items:center;
  box-shadow:0 10px 30px rgba(229,9,20,.5); }
.big-play.hidden { display:none; }

.pl-bottom { display:flex; flex-direction:column; gap:8px; margin-top:auto; }
.progress-row { display:flex; align-items:center; gap:10px;
  font-size:11px; font-weight:600; color:#fff; }
.progress-track { flex:1; height:4px; background:rgba(255,255,255,.25);
  border-radius:2px; position:relative; cursor:pointer; }
.progress-track::before { content:''; position:absolute; inset:-8px 0; }
.progress-buffer { position:absolute; top:0; left:0; height:100%;
  background:rgba(255,255,255,.35); border-radius:2px; width:0%; }
.progress-fill { position:absolute; top:0; left:0; height:100%;
  background:var(--accent); border-radius:2px; width:0%; }
.progress-fill::after { content:''; position:absolute; right:-6px; top:-4px;
  width:12px; height:12px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 8px rgba(229,9,20,.8); }

.brow { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.brow-left { display:flex; align-items:center; gap:6px; }
.pl-mini { width:34px; height:34px; font-size:15px;
  background:rgba(0,0,0,.55); border-radius:50%; border:none;
  color:#fff; cursor:pointer; display:grid; place-items:center; }

.vol-slider { width:0; opacity:0; transition:all .25s;
  -webkit-appearance:none; height:4px; background:rgba(255,255,255,.3);
  border-radius:2px; outline:none; }
.vol-wrap:hover .vol-slider { width:70px; opacity:1; }
.vol-slider::-webkit-slider-thumb { -webkit-appearance:none;
  width:12px; height:12px; border-radius:50%; background:#fff; cursor:pointer; }

.loader { position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%); width:46px; height:46px;
  border:3px solid rgba(255,255,255,.15); border-top-color:var(--accent);
  border-radius:50%; animation:spin 0.9s linear infinite;
  display:none; z-index:6; }
.loader.show { display:block; }
@keyframes spin { to { transform:translate(-50%,-50%) rotate(360deg); } }

.q-menu { position:absolute; top:56px; right:14px;
  background:rgba(15,15,20,.98); backdrop-filter:blur(14px);
  border:1px solid #2a2a35; border-radius:10px; padding:6px;
  min-width:160px; z-index:60;
  box-shadow:0 14px 40px rgba(0,0,0,.85); }
.q-menu.hidden { display:none; }
.q-item { padding:10px 12px; border-radius:6px; font-size:13px;
  cursor:pointer; display:flex; justify-content:space-between;
  align-items:center; color:#d0d0d8; }
.q-item:hover { background:#252530; color:#fff; }
.q-item span { font-size:10px; color:var(--muted); font-weight:700; }
.q-item.active { color:var(--accent); }

.now-playing { padding:14px 18px 4px; }
.now-title { font-size:14.5px; font-weight:700; line-height:1.3; }
.now-sub { font-size:11.5px; color:var(--muted); margin-top:3px; }

.action-grid { padding:14px 18px 0; display:grid;
  grid-template-columns:1fr 1fr; gap:10px; }
.action-btn { padding:13px; border-radius:8px; font-size:13.5px;
  font-weight:700; cursor:pointer; display:flex; align-items:center;
  justify-content:center; gap:8px; border:2px solid transparent; }
.action-btn.shorten { background:rgba(229,9,20,.1); color:var(--accent);
  border-color:rgba(229,9,20,.5); }
.action-btn.direct { background:#1a1a22; color:#d0d0d8; border-color:#2a2a35; }

.info-box { margin:14px 18px 0; padding:13px 15px;
  background:rgba(229,9,20,.06); border-left:3px solid var(--accent);
  border-radius:6px; font-size:12.5px; line-height:1.55; color:#e0e0e8; }
.info-box .hl { color:var(--accent); font-weight:700; }

.warn-box { margin:14px 18px 0; padding:13px 15px;
  background:rgba(255,180,0,.08); border:1px solid rgba(255,180,0,.35);
  border-radius:8px; color:#ffcc55; font-size:12.5px; line-height:1.55; }
.warn-box strong { color:#ffb400; }

.nav-btns { padding:14px 18px 0; display:grid;
  grid-template-columns:1fr 1fr; gap:10px; }
.nav-btn { padding:13px; border-radius:8px; background:#16161e;
  border:1px solid #24242e; color:#d0d0d8; font-size:13px;
  font-weight:600; display:flex; align-items:center; justify-content:center;
  gap:8px; cursor:pointer; text-decoration:none; }
.nav-btn.next { color:var(--accent); border-color:rgba(229,9,20,.4); }
.nav-btn.disabled { opacity:.35; pointer-events:none; }

.sec-title { display:flex; align-items:center; gap:10px;
  padding:0 18px; margin:24px 0 14px; }
.sec-title::before { content:''; width:4px; height:18px;
  background:var(--accent); border-radius:2px; }
.sec-title h2 { font-size:14px; font-weight:800; letter-spacing:.5px; }
.sec-title .count { font-size:11px; color:var(--muted);
  font-weight:600; margin-left:auto; }

.ep-grid { display:grid; grid-template-columns:repeat(3,1fr);
  gap:10px; padding:0 18px; }
@media (min-width:600px) { .ep-grid { grid-template-columns:repeat(4,1fr); } }

.ep-card { position:relative; border-radius:8px; overflow:hidden;
  cursor:pointer; aspect-ratio:16/11; background:var(--card);
  border:1px solid #1e1e28; transition:transform .2s, border-color .2s; }
.ep-card:hover { transform:translateY(-3px); }
.ep-card.active { border:2px solid var(--accent); }
.ep-card img { width:100%; height:100%; object-fit:cover; display:block; }
.ep-overlay { position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.95) 0%,
    rgba(0,0,0,.15) 55%, transparent 100%); }
.ep-card.active .ep-overlay {
  background:linear-gradient(to top, rgba(229,9,20,.5) 0%,
    rgba(0,0,0,.4) 60%, transparent 100%); }
.ep-num { position:absolute; top:6px; left:6px;
  background:var(--accent); color:#fff; font-size:11px; font-weight:800;
  padding:2px 7px; border-radius:4px; min-width:22px; text-align:center; }
.ep-card.active .ep-num { background:#fff; color:var(--accent); }
.ep-title { position:absolute; bottom:6px; left:6px; right:6px;
  font-size:11px; font-weight:600; line-height:1.25; color:#fff;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; }

.anime-info { padding:24px 18px 0; margin-top:24px;
  border-top:1px solid #1e1e28; }
.ai-header { display:flex; gap:14px; margin-bottom:16px; }
.ai-poster { width:90px; height:130px; border-radius:8px;
  object-fit:cover; flex-shrink:0; border:1px solid #22222c; }
.ai-right h2 { font-size:16px; font-weight:800; margin-bottom:10px; }
.badges-row { display:flex; flex-wrap:wrap; gap:6px; }
.chip-badge { font-size:10.5px; font-weight:700; padding:3px 8px;
  border-radius:5px; border:1px solid #2a2a35; background:#1a1a22; color:#d0d0d8; }
.chip-badge.rating { color:var(--accent);
  border-color:rgba(229,9,20,.4); background:rgba(229,9,20,.1); }
.chip-badge.lang { color:#ff8a3d;
  border-color:rgba(255,138,61,.4); background:rgba(255,138,61,.1); }

.bottom-nav { position:fixed; bottom:0; left:0; right:0;
  background:rgba(11,11,15,.98); backdrop-filter:blur(10px);
  border-top:1px solid #1e1e28; display:flex;
  justify-content:space-around; padding:10px 0 12px; z-index:200; }
.bn-item { display:flex; flex-direction:column; align-items:center;
  gap:3px; color:var(--muted); font-size:10px; font-weight:700;
  text-decoration:none; cursor:pointer; }
.bn-item.active { color:var(--accent); }
.bn-item .bn-icon { font-size:20px; }
</style>
</head>
<body>

<div class="topbar">
  <button class="tb-btn" onclick="location.href='anime.html?id=' + animeId">←</button>
  <div class="logo">ANIME<span>VERSE</span></div>
  <div style="display:flex;gap:8px">
    <button class="tb-btn" onclick="navigator.share?.({title:document.title,url:location.href})">📤</button>
  </div>
</div>

<div class="player-shell" id="playerShell">
  <video id="video" playsinline preload="metadata"></video>
  <button class="big-play" id="bigPlay">▶</button>
  <div class="loader" id="loader"></div>

  <div class="pl-ui" id="plUi">
    <div class="pl-top">
      <span class="pl-pill" id="audioPill">🔊 Audio</span>
      <div class="pl-top-right">
        <span class="pl-pill" id="speedBtn">1x</span>
        <span class="pl-pill quality" id="qualityBtn">Auto ▾</span>
        <span class="pl-pill" id="pipBtn">🔘</span>
      </div>
    </div>

    <div class="pl-center">
      <button class="pl-btn" id="rewBtn">⟲<span class="bt-label">10s</span></button>
      <button class="pl-btn big" id="playBtn">▶</button>
      <button class="pl-btn" id="fwdBtn">⟳<span class="bt-label">10s</span></button>
    </div>

    <div class="pl-bottom">
      <div class="progress-row">
        <span id="timeNow">0:00</span>
        <div class="progress-track" id="progressTrack">
          <div class="progress-buffer" id="progressBuffer"></div>
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="timeEnd">0:00</span>
      </div>
      <div class="brow">
        <div class="brow-left">
          <button class="pl-mini" id="muteBtn">🔊</button>
          <div class="vol-wrap">
            <input type="range" class="vol-slider" id="volSlider"
                   min="0" max="1" step="0.05" value="1">
          </div>
        </div>
        <div class="brow-left">
          <button class="pl-mini" id="skipPrev">⏮</button>
          <button class="pl-mini" id="skipNext">⏭</button>
          <button class="pl-mini" id="fsBtn">⛶</button>
        </div>
      </div>
    </div>
  </div>

  <div class="q-menu hidden" id="qualityMenu"></div>
</div>

<div class="now-playing">
  <div class="now-title" id="nowTitle">Loading...</div>
  <div class="now-sub" id="nowSub">—</div>
</div>

<div class="action-grid">
  <button class="action-btn shorten" onclick="alert('Shortener page')">⚡ Shortener</button>
  <button class="action-btn direct" onclick="alert('Direct download')">⬇ Direct</button>
</div>

<div class="info-box">
  <span class="hl">Please use Shortener</span> to download — it helps support the site.
</div>

<div class="warn-box">
  🔊 <strong>No Audio? (EAC3 / Dolby):</strong> Browser me EAC3 decode nahi hota.
  Video download karke MX Player / VLC me play karein.
</div>

<div class="nav-btns">
  <a class="nav-btn disabled" id="prevBtn">⏮ No Previous</a>
  <a class="nav-btn next" id="nextBtn">Next ⏭</a>
</div>

<div class="sec-title">
  <h2>EPISODES</h2>
  <span class="count" id="epCount">—</span>
</div>
<div class="ep-grid" id="epGrid"></div>

<div class="anime-info" id="animeInfo"></div>

<nav class="bottom-nav">
  <a class="bn-item" href="index.html"><span class="bn-icon">🏠</span>HOME</a>
  <a class="bn-item active"><span class="bn-icon">▶️</span>WATCH</a>
  <a class="bn-item" onclick="location.reload()"><span class="bn-icon">🔄</span>REFRESH</a>
  <a class="bn-item" href="admin.html"><span class="bn-icon">⚙️</span>ADMIN</a>
</nav>

<script src="data.js"></script>
<script>
const params    = new URLSearchParams(location.search);
const animeId   = Number(params.get('id')) || 1;
let   seasonNum = Number(params.get('s'))  || 1;
let   epNum     = Number(params.get('ep')) || 1;
let   currentQuality = 'Auto';
let   hlsInstance = null;
let   hideTimer = null;
let   anime = null;
let   navPrevEp = null, navNextEp = null;

const video   = document.getElementById('video');
const shell   = document.getElementById('playerShell');
const plUi    = document.getElementById('plUi');
const loader  = document.getElementById('loader');
const bigPlay = document.getElementById('bigPlay');

onDBReady(() => {
  anime = getAnime(animeId);
  if (!anime) {
    document.body.innerHTML = '<p style="padding:40px;text-align:center;color:#9a9aa5;font-family:sans-serif">Anime nahi mila</p>';
    return;
  }
  initPlayer();
});

function initPlayer() {
  renderAnimeInfo();
  buildQualityMenu();
  loadEpisode(epNum, false);
  setupControls();
  setupAutoHide();
  setupKeyboard();
  window.addEventListener('popstate', onPopState);
}

function loadVideo(url) {
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  loader.classList.add('show');
  bigPlay.classList.add('hidden');

  if (url.includes('.m3u8') && Hls.isSupported()) {
    hlsInstance = new Hls();
    hlsInstance.loadSource(url);
    hlsInstance.attachMedia(video);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
      loader.classList.remove('show');
      video.play().catch(() => bigPlay.classList.remove('hidden'));
    });
    hlsInstance.on(Hls.Events.ERROR, (e, d) => {
      if (d.fatal) { loader.classList.remove('show');
        alert('Video load nahi hua'); }
    });
  } else if (url.includes('.m3u8') && video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.addEventListener('loadedmetadata', () => {
      loader.classList.remove('show');
      video.play().catch(() => {});
    }, { once: true });
  } else {
    video.src = url;
    video.load();
    video.addEventListener('loadedmetadata', () => {
      loader.classList.remove('show');
      video.play().catch(() => bigPlay.classList.remove('hidden'));
    }, { once: true });
  }
}

function loadEpisode(num, pushUrl = true) {
  const season = anime.seasons.find(s => s.number === seasonNum);
  if (!season) return;
  const ep = season.episodes.find(e => e.num === num);
  if (!ep) return;
  epNum = num;

  let url = ep.videoUrl;
  if (currentQuality === '720p' && ep.videoUrl720) url = ep.videoUrl720;
  if (currentQuality === '480p' && ep.videoUrl480) url = ep.videoUrl480;

  if (!url) return alert('Is episode ka video URL nahi hai');

  loadVideo(url);

  document.getElementById('nowTitle').textContent =
    `S${seasonNum} · E${epNum} — ${ep.title}`;
  document.getElementById('nowSub').textContent =
    `${anime.title} · ${ep.duration}`;

  trackView(anime.id, ep.num);

  const idx = season.episodes.findIndex(e => e.num === epNum);
  navPrevEp = idx > 0 ? season.episodes[idx-1] : null;
  navNextEp = idx < season.episodes.length-1 ? season.episodes[idx+1] : null;
  updateNavButtons();

  document.getElementById('epCount').textContent =
    `${season.episodes.length} Episodes · Season ${seasonNum}`;

  document.getElementById('epGrid').innerHTML = season.episodes.map(e => `
    <div class="ep-card ${e.num === epNum ? 'active' : ''}" data-ep="${e.num}">
      <img src="${imgUrl(e.thumb, 300, 200)}" alt="" loading="lazy">
      <div class="ep-overlay"></div>
      <span class="ep-num">${e.num}</span>
      <span class="ep-title">${e.title}</span>
    </div>
  `).join('');

  document.querySelectorAll('.ep-card').forEach(c => {
    c.addEventListener('click', () => {
      loadEpisode(Number(c.dataset.ep));
      shell.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });

  document.title = `${anime.title} — S${seasonNum}E${epNum}`;
  if (pushUrl) {
    history.pushState({}, '', `watch.html?id=${anime.id}&s=${seasonNum}&ep=${epNum}`);
  }
}

function updateNavButtons() {
  const p = document.getElementById('prevBtn');
  const n = document.getElementById('nextBtn');
  if (navPrevEp) {
    p.classList.remove('disabled');
    p.textContent = `⏮ S${seasonNum}E${navPrevEp.num}`;
    p.onclick = () => loadEpisode(navPrevEp.num);
  } else {
    p.classList.add('disabled');
    p.textContent = '⏮ No Previous';
  }
  if (navNextEp) {
    n.classList.remove('disabled');
    n.textContent = `S${seasonNum}E${navNextEp.num} ⏭`;
    n.onclick = () => loadEpisode(navNextEp.num);
  } else {
    n.classList.add('disabled');
    n.textContent = 'No Next ⏭';
  }
}

function setupControls() {
  const togglePlay = () => video.paused ? video.play().catch(()=>{}) : video.pause();
  document.getElementById('playBtn').onclick = togglePlay;
  bigPlay.onclick = togglePlay;
  video.onclick = togglePlay;
  video.ondblclick = toggleFs;

  document.getElementById('rewBtn').onclick = () =>
    video.currentTime = Math.max(0, video.currentTime - 10);
  document.getElementById('fwdBtn').onclick = () =>
    video.currentTime = Math.min(video.duration||0, video.currentTime + 10);

  document.getElementById('skipPrev').onclick = () =>
    navPrevEp && loadEpisode(navPrevEp.num);
  document.getElementById('skipNext').onclick = () =>
    navNextEp && loadEpisode(navNextEp.num);

  const muteBtn = document.getElementById('muteBtn');
  muteBtn.onclick = () => {
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? '🔇' : '🔊';
  };

  document.getElementById('volSlider').oninput = e => {
    video.volume = e.target.value;
    video.muted = e.target.value == 0;
    muteBtn.textContent = video.muted ? '🔇' : '🔊';
  };

  const speeds = [1, 1.25, 1.5, 2, 0.75, 0.5];
  const speedBtn = document.getElementById('speedBtn');
  speedBtn.onclick = () => {
    const i = speeds.indexOf(video.playbackRate);
    const s = speeds[(i+1) % speeds.length];
    video.playbackRate = s;
    speedBtn.textContent = s + 'x';
  };

  const audioModes = ['🔊 Audio','🎧 Hindi','🎌 Japanese','📝 Subbed'];
  let ai = 0;
  document.getElementById('audioPill').onclick = e => {
    ai = (ai+1) % audioModes.length;
    e.target.textContent = audioModes[ai];
  };

  document.getElementById('pipBtn').onclick = async () => {
    try {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else await video.requestPictureInPicture();
    } catch(e) { alert('PiP support nahi'); }
  };

  document.getElementById('fsBtn').onclick = toggleFs;

  video.ontimeupdate = () => {
    if (!video.duration) return;
    const pct = (video.currentTime / video.duration) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('timeNow').textContent = fmt(video.currentTime);
    document.getElementById('timeEnd').textContent = fmt(video.duration);
  };
  video.onprogress = () => {
    if (!video.buffered.length || !video.duration) return;
    const end = video.buffered.end(video.buffered.length-1);
    document.getElementById('progressBuffer').style.width =
      ((end / video.duration) * 100) + '%';
  };
  video.onplay = () => { setIcon(true); resetHideTimer(); };
  video.onpause = () => { setIcon(false); plUi.classList.remove('hide'); };
  video.onwaiting = () => loader.classList.add('show');
  video.onplaying = () => loader.classList.remove('show');
  video.onended = () => {
    if (video.duration) trackWatchTime(Math.floor(video.duration));
    if (navNextEp) setTimeout(() => loadEpisode(navNextEp.num), 800);
  };

  const track = document.getElementById('progressTrack');
  const seek = e => {
    const r = track.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const pct = Math.max(0, Math.min(1, x/r.width));
    if (video.duration) video.currentTime = pct * video.duration;
  };
  track.onclick = seek;
  let drag = false;
  track.onmousedown = e => { drag = true; seek(e); };
  window.onmousemove = e => drag && seek(e);
  window.onmouseup = () => drag = false;
  track.ontouchstart = seek;
  track.ontouchmove = seek;
}

function setIcon(playing) {
  document.getElementById('playBtn').textContent = playing ? '❚❚' : '▶';
  bigPlay.classList.toggle('hidden', playing);
}

function fmt(s) {
  if (isNaN(s)) return '0:00';
  const m = Math.floor(s/60);
  const ss = String(Math.floor(s%60)).padStart(2,'0');
  return `${m}:${ss}`;
}

function toggleFs() {
  if (document.fullscreenElement) document.exitFullscreen();
  else shell.requestFullscreen?.();
}

function buildQualityMenu() {
  const season = anime.seasons.find(s => s.number === seasonNum);
  const ep = season?.episodes.find(e => e.num === epNum);
  const qs = ['Auto','720p','480p'];
  const menu = document.getElementById('qualityMenu');
  menu.innerHTML = qs.map(q => {
    let avail = true;
    if (q === '720p' && !ep?.videoUrl720) avail = false;
    if (q === '480p' && !ep?.videoUrl480) avail = false;
    return `<div class="q-item ${q===currentQuality?'active':''}"
              data-q="${q}"
              style="${avail?'':'opacity:.4;pointer-events:none'}">
              ${q} <span>${avail?'':'N/A'}</span></div>`;
  }).join('');

  menu.querySelectorAll('.q-item').forEach(it => {
    it.onclick = () => {
      currentQuality = it.dataset.q;
      document.getElementById('qualityBtn').textContent = currentQuality + ' ▾';
      menu.classList.add('hidden');
      loadEpisode(epNum, false);
    };
  });

  document.getElementById('qualityBtn').onclick = e => {
    e.stopPropagation();
    menu.classList.toggle('hidden');
  };
  document.addEventListener('click', () => menu.classList.add('hidden'));
}

function resetHideTimer() {
  plUi.classList.remove('hide');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (!video.paused) plUi.classList.add('hide');
  }, 3000);
}
function setupAutoHide() {
  shell.addEventListener('mousemove', resetHideTimer);
  shell.addEventListener('touchstart', resetHideTimer);
}

function setupKeyboard() {
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    switch(e.key) {
      case ' ': case 'k': e.preventDefault();
        video.paused ? video.play() : video.pause(); break;
      case 'ArrowLeft':  video.currentTime -= 5; break;
      case 'ArrowRight': video.currentTime += 5; break;
      case 'ArrowUp':    video.volume = Math.min(1, video.volume+0.1); break;
      case 'ArrowDown':  video.volume = Math.max(0, video.volume-0.1); break;
      case 'f': toggleFs(); break;
      case 'm': video.muted = !video.muted; break;
      case 'n': navNextEp && loadEpisode(navNextEp.num); break;
      case 'p': navPrevEp && loadEpisode(navPrevEp.num); break;
    }
  });
}

function onPopState() {
  const p = new URLSearchParams(location.search);
  seasonNum = Number(p.get('s')) || 1;
  const n = Number(p.get('ep')) || 1;
  if (n !== epNum) loadEpisode(n, false);
}

function renderAnimeInfo() {
  const a = anime;
  const totalEps = (a.seasons||[]).reduce((s,x) => s + (x.episodes?.length||0), 0);
  document.getElementById('animeInfo').innerHTML = `
    <div class="ai-header">
      <img class="ai-poster" src="${imgUrl(a.poster, 200, 300)}" alt="">
      <div class="ai-right">
        <h2>${a.title}</h2>
        <div class="badges-row">
          <span class="chip-badge rating">★ ${a.rating}</span>
          <span class="chip-badge">S${a.seasons?.length||0}</span>
          <span class="chip-badge">E${totalEps}</span>
          <span class="chip-badge">${a.status}</span>
          <span class="chip-badge lang">${langLabels[a.lang]||'JP'}</span>
        </div>
      </div>
    </div>
  `;
}
</script>
</body>
